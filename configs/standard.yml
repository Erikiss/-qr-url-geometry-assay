seed: 267010

sources:
  surface:
    paths: [data/raw/surface]
    scan_limit: 10000000
    deduplicate: false
    granularity: url
  onion:
    paths: [data/raw/onion]
    scan_limit: null
    deduplicate: true
    granularity: url

sampling:
  target_pairs: 100000
  reservoir_per_length: 10000
  min_bytes: 16
  max_bytes: 512
  scheme_policy: strip
  synthetic_mode: grammar_random

qr:
  error_correction: M
  masks: [0, 1, 2, 3, 4, 5, 6, 7]
  border: 0

transforms:
  # Corpus inference uses the primary state only. Deterministic rotation/polarity
  # identities are checked in configs/equivariance.yml and the smoke tests.
  group: factorial
  rotations: [0]
  inversions: [false]
  reflections: [none]
  scales: [1]

execution:
  workers: 0
  chunk_size: 256

outputs:
  directory: results/standard
  store_payload_text: true
  png_examples_per_class: 2

analysis:
  density_bin_width: 0.005
