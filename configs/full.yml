seed: 267010

sources:
  surface:
    paths: [data/raw/surface]
    scan_limit: null
    deduplicate: false
    granularity: origin
    # origin is deduplicated by protocol even when the upstream source claims
    # uniqueness. At DomainsProject scale the exact seen-set must be disk-backed.
    dedup_backend: sqlite
  onion:
    paths: [data/raw/onion]
    scan_limit: null
    deduplicate: true
    granularity: origin
    versions: [3]
    dedup_backend: sqlite

sampling:
  target_pairs: 1500000
  reservoir_per_length: 1500000
  min_bytes: 16
  max_bytes: 1024
  # Remove the arbitrary https-vs-http prefix before matching/encoding.
  scheme_policy: strip
  # Preserve the shared empirical byte-length support rather than weighting rare
  # lengths equally with common ones.
  length_weighting: overlap
  # Weakest null in the ladder; repeat with token_shuffle/class_permute configs
  # before interpreting a natural-vs-synthetic effect structurally.
  synthetic_mode: grammar_random

qr:
  error_correction: M
  # Every payload is encoded under every QR mask. Mask is a within-payload factor.
  masks: [0, 1, 2, 3, 4, 5, 6, 7]
  border: 0

transforms:
  # The million-scale corpus run stores only the primary state. Rotations and
  # polarity flips are deterministic matrix operations and belong in the much
  # smaller equivariance calibration, not in redundant corpus-scale rows.
  group: factorial
  rotations: [0]
  inversions: [false]
  reflections: [none]
  scales: [1]

execution:
  workers: 0
  chunk_size: 256

outputs:
  directory: results/full
  store_payload_text: true
  png_examples_per_class: 3

analysis:
  density_bin_width: 0.005
