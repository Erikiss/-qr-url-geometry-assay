name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
      - run: qr-assay demo-data --output-dir data/raw/demo --pairs 30
      - run: qr-assay run --config configs/smoke.yml --set sampling.target_pairs=20 --set execution.workers=2
