seed: 267010

# This arm requires full observed URLs on BOTH sides. DomainsProject host dumps
# are not valid input here because they contain no natural path/query grammar.
sources:
  surface:
    paths: [data/raw/surface_urls]
    scan_limit: null
    deduplicate: true
    granularity: path_query
  onion:
    paths: [data/raw/onion]
    scan_limit: null
    deduplicate: true
    granularity: path_query
    versions: [3]

sampling:
  target_pairs: 100000
  reservoir_per_length: 25000
  # Exclude trivial slash-only/very short suffixes; this arm is explicitly
  # about nontrivial path/query sequence structure.
  min_bytes: 16
  max_bytes: 512
  scheme_policy: strip
  # Repeat this config with token_shuffle and class_permute before interpreting
  # a surviving effect as higher-order sequence structure.
  synthetic_mode: grammar_random

qr:
  error_correction: M
  masks: [0, 1, 2, 3, 4, 5, 6, 7]
  border: 0

transforms:
  # Confirmatory grammar inference uses only the identity state. Deterministic
  # D4/polarity transformations are a separate calibration arm.
  group: factorial
  rotations: [0]
  inversions: [false]
  reflections: [none]
  scales: [1]

execution:
  workers: 0
  chunk_size: 256

outputs:
  directory: results/grammar
  store_payload_text: true
  png_examples_per_class: 3

analysis:
  density_bin_width: 0.005
