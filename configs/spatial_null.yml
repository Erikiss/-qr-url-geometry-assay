seed: 267010

sources:
  surface:
    paths: [data/raw/surface_urls]
    scan_limit: null
    deduplicate: true
    granularity: path_query
  onion:
    paths: [data/raw/onion]
    scan_limit: null
    deduplicate: true
    granularity: path_query
    versions: [3]

sampling:
  # Placement permutations are the expensive axis here. Keep corpus size modest
  # and assess Monte-Carlo convergence before increasing both dimensions.
  target_pairs: 5000
  reservoir_per_length: 10000
  min_bytes: 16
  max_bytes: 512
  scheme_policy: strip
  length_weighting: overlap
  synthetic_mode: grammar_random

qr:
  error_correction: M
  masks: [0, 1, 2, 3, 4, 5, 6, 7]
  border: 0

transforms:
  group: factorial
  rotations: [0]
  inversions: [false]
  reflections: [none]
  scales: [1]

execution:
  workers: 0
  chunk_size: 256

outputs:
  directory: results/spatial-null
  store_payload_text: true
  png_examples_per_class: 2

analysis:
  density_bin_width: 0.005
  spatial_null_diagnostics: true
  spatial_null_mask: 0
  spatial_null_permutations: 64
