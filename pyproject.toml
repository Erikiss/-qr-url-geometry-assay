[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "qr-url-geometry-assay"
version = "0.2.0"
description = "CPU-only controlled QR geometry assay for natural surface/onion URL structure and explicit structural nulls."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Erik Rudolph"}]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10.0,<12",
  "PyYAML>=6.0,<7",
  # QR matrices and the data-region mask both depend on this implementation.
  "qrcode==8.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "pytest-cov>=5.0,<7", "ruff>=0.16,<0.17"]

[project.scripts]
qr-assay = "qr_assay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qr_assay"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
